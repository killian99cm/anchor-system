name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Pages
        run: |
          mkdir -p _site
          # Copy example dashboard as index
          cp "06-dashboard/portfolio_analysis_example.html" _site/index.html
          cp "06-dashboard/portfolio_data_example.json" _site/
          # Copy anchor-pro page
          cp "08-website/anchor-pro.html" _site/anchor-pro.html
          # Copy diagrams (anchor-pro 引用 diagrams/*.html 链接)
          cp -r "08-website/diagrams" _site/diagrams
          # Copy calculator
          cp "05-scripts/anchor_calculator.html" _site/anchor_calculator.html
          # Copy track-record page (simulated backtest)
          cp "08-website/track-record.html" _site/track-record.html
          # Copy docs index
          cp -r docs _site/docs
          # Copy backtest chart PNGs referenced by track-record
          mkdir -p "_site/09-backtest/output"
          cp 09-backtest/output/full_anchor_vs_benchmark.png 09-backtest/output/takeprofit_compare_return.png "_site/09-backtest/output/"
          # Create redirects from old paths
          mkdir -p _site/06-dashboard
          cp "06-dashboard/portfolio_analysis_example.html" "_site/06-dashboard/portfolio_analysis.html"

      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
