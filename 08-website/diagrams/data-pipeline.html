<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor 数据管道 · 四层规范</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #02070f;
      --color-ink:    #e8f1ff;
      --color-muted:  #91a4bd;
      --color-soft:   #536a85;
      --color-accent: #3987e5;
      --color-good:   #36d39c;
      --color-warn:   #fab219;
      --color-system: #9085e9;
      --font-sans:    'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono:    'Cascadia Mono', Consolas, ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    .foot-note { color: var(--color-soft); font-size: 0.8rem; margin-top: 0.6rem; text-align: center; font-family: var(--font-mono); }
      /* v4.2.1 顶级审美升级 */
    .frame { animation: frameIn .8s ease both; }
    @keyframes frameIn { from{opacity:0; transform:translateY(18px)} to{opacity:1; transform:none} }
    svg .flow { stroke-dasharray: 7 7; animation: flowMove 1.1s linear infinite; }
    @keyframes flowMove { to { stroke-dashoffset: -14; } }
    .frame:hover svg { filter: brightness(1.12) drop-shadow(0 0 18px rgba(57,135,229,.18)); }
    @media (prefers-reduced-motion: reduce){ .frame{animation:none} svg .flow{animation:none; stroke-dasharray:none} }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Anchor Data Pipeline · Four-Layer Discipline</p>
    <h1>数据管道 · 从持仓到结论的四层过滤</h1>
    <svg viewBox="0 0 980 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dp-title dp-desc">
      <title id="dp-title">Anchor 数据管道四层规范</title>
      <desc id="dp-desc">定位层、获取层、归因层、验证层，从持仓到报告结论的四层数据过滤。</desc>
      <defs>
        <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(232,241,255,0.45)"/>
        </marker>
        <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(232,241,255,0.05)"/>
        </pattern>
              <radialGradient id="glow" cx="50%" cy="40%" r="62%">
          <stop offset="0%" stop-color="rgba(57,135,229,0.15)"/>
          <stop offset="55%" stop-color="rgba(57,135,229,0.05)"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <rect width="100%" height="100%" fill="#02070f"/>
      <rect width="100%" height="100%" fill="url(#dots)" opacity="0.5"/>
      <rect width="100%" height="100%" fill="url(#glow)"/>

      <text x="60" y="58" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" letter-spacing="0.15em">数据源</text>
      <rect x="40" y="72" width="180" height="44" rx="4" fill="rgba(57,135,229,0.10)" stroke="#3987e5" stroke-width="0.8"/>
      <text x="130" y="91" fill="#e8f1ff" font-size="10.5" font-family="'Segoe UI', sans-serif" text-anchor="middle">portfolio_data.json</text>
      <text x="130" y="105" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" text-anchor="middle">持仓 / 成本 / 盈亏（唯一权威）</text>

      <rect x="40" y="130" width="180" height="44" rx="4" fill="rgba(57,135,229,0.10)" stroke="#3987e5" stroke-width="0.8"/>
      <text x="130" y="149" fill="#e8f1ff" font-size="10.5" font-family="'Segoe UI', sans-serif" text-anchor="middle">mx-data 妙想行情</text>
      <text x="130" y="163" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" text-anchor="middle">实时行情 / 资金面 / 估值</text>

      <rect x="280" y="52" width="190" height="150" rx="4" fill="rgba(144,133,233,0.07)" stroke="#9085e9" stroke-width="1"/>
      <text x="375" y="74" fill="#9085e9" font-size="11" font-weight="600" text-anchor="middle">① 定位层</text>
      <text x="375" y="90" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">POSITIONING</text>
      <line x1="330" y1="100" x2="420" y2="100" stroke="rgba(144,133,233,0.3)" stroke-width="0.8"/>
      <text x="375" y="118" fill="#91a4bd" font-size="9" text-anchor="middle">持仓 → 跟踪指数</text>
      <text x="375" y="134" fill="#91a4bd" font-size="9" text-anchor="middle">→ 市场 → 资金面来源</text>
      <text x="375" y="150" fill="#91a4bd" font-size="9" text-anchor="middle">→ 宏观归因 映射</text>
      <text x="375" y="170" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">防张冠李戴</text>

      <rect x="520" y="52" width="190" height="150" rx="4" fill="rgba(144,133,233,0.07)" stroke="#9085e9" stroke-width="1"/>
      <text x="615" y="74" fill="#9085e9" font-size="11" font-weight="600" text-anchor="middle">② 获取层</text>
      <text x="615" y="90" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">ACQUISITION</text>
      <line x1="570" y1="100" x2="660" y2="100" stroke="rgba(144,133,233,0.3)" stroke-width="0.8"/>
      <text x="615" y="118" fill="#91a4bd" font-size="9" text-anchor="middle">mx-data 查询模板</text>
      <text x="615" y="134" fill="#91a4bd" font-size="9" text-anchor="middle">标准资金面快照解析</text>
      <text x="615" y="150" fill="#91a4bd" font-size="9" text-anchor="middle">严格时间戳 + 来源标注</text>
      <text x="615" y="170" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">防查询失败 / 口径混乱</text>

      <rect x="760" y="52" width="190" height="150" rx="4" fill="rgba(144,133,233,0.07)" stroke="#9085e9" stroke-width="1"/>
      <text x="855" y="74" fill="#9085e9" font-size="11" font-weight="600" text-anchor="middle">③ 归因层</text>
      <text x="855" y="90" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">ATTRIBUTION</text>
      <line x1="810" y1="100" x2="900" y2="100" stroke="rgba(144,133,233,0.3)" stroke-width="0.8"/>
      <text x="855" y="118" fill="#91a4bd" font-size="9" text-anchor="middle">资产类别 → 正确宏观指标</text>
      <text x="855" y="134" fill="#91a4bd" font-size="8.5" text-anchor="middle">债券→中国10Y 非美债</text>
      <text x="855" y="148" fill="#91a4bd" font-size="8.5" text-anchor="middle">港股→南向 非 A股 DDX</text>
      <text x="855" y="170" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">防因果错配</text>

      <rect x="340" y="270" width="300" height="82" rx="4" fill="rgba(54,211,156,0.08)" stroke="#36d39c" stroke-width="1.2"/>
      <text x="490" y="294" fill="#36d39c" font-size="11" font-weight="600" text-anchor="middle">④ 验证层</text>
      <text x="490" y="310" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">VALIDATION</text>
      <text x="490" y="328" fill="#91a4bd" font-size="9" text-anchor="middle">data_quality_check() 报告前自检</text>
      <text x="490" y="342" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">python data_pipeline.py --check</text>

      <rect x="700" y="270" width="230" height="82" rx="4" fill="rgba(57,135,229,0.12)" stroke="#3987e5" stroke-width="1.4"/>
      <text x="815" y="292" fill="#e8f1ff" font-size="11" font-weight="600" text-anchor="middle">报告 / 结论 / 建议</text>
      <text x="815" y="310" fill="#91a4bd" font-size="8.5" text-anchor="middle">时间戳精确 · 来源可溯</text>
      <text x="815" y="326" fill="#36d39c" font-size="8.5" text-anchor="middle">符合 Anchor 建议纪律</text>

      <line x1="220" y1="94" x2="276" y2="94" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">
      <line x1="220" y1="152" x2="276" y2="152" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">
      <line x1="470" y1="94" x2="516" y2="94" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">
      <line x1="710" y1="94" x2="756" y2="94" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">
      <path d="M 855 202 L 855 250 L 640 250 L 640 266" fill="none" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">
      <line x1="640" y1="311" x2="696" y2="311" stroke="rgba(232,241,255,0.35)" stroke-width="1" marker-end="url(#arrow)"/ class="flow">

      <line x1="40" y1="410" x2="940" y2="410" stroke="rgba(232,241,255,0.12)" stroke-width="0.8"/>
      <text x="40" y="430" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" letter-spacing="0.18em">用法</text>
      <rect x="40" y="442" width="14" height="10" fill="rgba(144,133,233,0.2)" stroke="#9085e9" stroke-width="0.8"/>
      <text x="62" y="451" fill="#91a4bd" font-size="8.5">--map 全持仓映射</text>
      <rect x="220" y="442" width="14" height="10" fill="rgba(144,133,233,0.2)" stroke="#9085e9" stroke-width="0.8"/>
      <text x="242" y="451" fill="#91a4bd" font-size="8.5">--lookup 单只查询</text>
      <rect x="400" y="442" width="14" height="10" fill="rgba(54,211,156,0.2)" stroke="#36d39c" stroke-width="0.8"/>
      <text x="422" y="451" fill="#91a4bd" font-size="8.5">--check 报告前自检（必跑）</text>
      <text x="700" y="451" fill="#536a85" font-size="8.5" font-family="'Cascadia Mono', monospace" font-style="italic">规则建立于 8/20，历次教训固化</text>
    </svg>
    <p class="foot-note">数据管道规范 v1.0 · 8/20 确立 · data_pipeline.py</p>
  </div>
</body>
</html>
