name: Anchor Daily Report

# ⚠️ 已停用（2026-08-17 审计）：本工作流引用的 05-scripts/归档/anchor_daily_report.py
# 已于 v3.4 归档并加入 .gitignore（仓库中不存在），计划任务会静默失败。
# 现行方案：Windows 计划任务「Anchor每日建议」（14:30 盘中推送）+「Anchor每日兜底同步」（21:40）
# 如需恢复云日报，请重建脚本并重新提交；否则仅保留手动触发。
on:
  workflow_dispatch:

jobs:
  report:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare requests

      - name: Generate report
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: python "05-scripts/归档/anchor_daily_report.py"

      - name: Push result
        run: |
          git config user.name "Anchor Bot"
          git config user.email "bot@anchor.investments"
          git add 04-reviews/ 06-dashboard/
          git diff --staged --quiet || git commit -m "Daily report $(date +%Y-%m-%d)"
          git push origin HEAD
