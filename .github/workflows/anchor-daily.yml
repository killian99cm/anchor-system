name: Anchor Daily Report

on:
  schedule:
    - cron: '30 7 * * 1-5'  # 15:30 Beijing, Mon-Fri
  workflow_dispatch:

jobs:
  report:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install akshare requests

      - name: Generate report
        env:
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
          SERVER_KEY: ${{ secrets.SERVER_KEY }}
        run: python "05-scripts/归档/anchor_daily_report.py"

      - name: Push result
        run: |
          git config user.name "Anchor Bot"
          git config user.email "bot@anchor.investments"
          git add 04-reviews/ 06-dashboard/
          git diff --staged --quiet || git commit -m "Daily report $(date +%Y-%m-%d)"
          git push origin HEAD
