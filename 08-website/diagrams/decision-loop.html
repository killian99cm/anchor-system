<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anchor 决策闭环 · T+3 复盘循环</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:  #02070f;
      --color-ink:    #e8f1ff;
      --color-muted:  #91a4bd;
      --color-soft:   #536a85;
      --color-accent: #3987e5;
      --color-good:   #36d39c;
      --color-warn:   #fab219;
      --color-system: #9085e9;
      --font-sans:    'Segoe UI', 'Microsoft YaHei', system-ui, sans-serif;
      --font-mono:    'Cascadia Mono', Consolas, ui-monospace, monospace;
    }
    body { font-family: var(--font-sans); background: var(--color-paper); color: var(--color-ink); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; }
    .frame { max-width: 1200px; width: 100%; }
    .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--color-muted); margin-bottom: 0.5rem; }
    h1 { font-size: clamp(1.4rem, 2.2vw + 0.7rem, 1.9rem); font-weight: 600; letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 1.4rem; }
    svg { width: 100%; min-width: 980px; display: block; }
    .foot-note { color: var(--color-soft); font-size: 0.8rem; margin-top: 0.6rem; text-align: center; font-family: var(--font-mono); }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Anchor Decision Loop · Judge Then Verify</p>
    <h1>决策闭环 · 每一次建议都要被时间审判</h1>
    <svg viewBox="0 0 980 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="dl-title dl-desc">
      <title id="dl-title">Anchor 决策闭环：决策 → 记录 → 复盘 → 校准</title>
      <desc id="dl-desc">决策建议记录后，T+3 复盘回填正确与否，滚动计算胜率校准体系。</desc>
      <defs>
        <marker id="dl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
          <path d="M 0 0 L 10 5 L 0 10 z" fill="rgba(232,241,255,0.5)"/>
        </marker>
        <pattern id="dl-dots" width="22" height="22" patternUnits="userSpaceOnUse">
          <circle cx="1" cy="1" r="0.9" fill="rgba(232,241,255,0.05)"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="#02070f"/>
      <rect width="100%" height="100%" fill="url(#dl-dots)" opacity="0.5"/>

      <!-- Clock center -->
      <circle cx="490" cy="150" r="66" fill="rgba(57,135,229,0.05)" stroke="rgba(57,135,229,0.4)" stroke-width="1" stroke-dasharray="3 4"/>
      <text x="490" y="118" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" text-anchor="middle" letter-spacing="0.2em">决策时钟</text>
      <text x="490" y="146" fill="#e8f1ff" font-size="15" font-weight="600" font-family="'Cascadia Mono', monospace" text-anchor="middle">T+3</text>
      <text x="490" y="164" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" text-anchor="middle">3 日后复盘</text>
      <text x="490" y="194" fill="#536a85" font-size="7" font-family="'Cascadia Mono', monospace" text-anchor="middle">CYCLE COMPLETE</text>

      <!-- Step 1: 建议 (top-left) -->
      <rect x="150" y="40" width="200" height="92" rx="5" fill="rgba(57,135,229,0.08)" stroke="#3987e5" stroke-width="1.1"/>
      <circle cx="176" cy="64" r="11" fill="#3987e5" opacity="0.25"/>
      <text x="176" y="68" fill="#3987e5" font-size="11" font-weight="700" font-family="'Cascadia Mono', monospace" text-anchor="middle">1</text>
      <text x="198" y="68" fill="#e8f1ff" font-size="12" font-weight="600">记录决策建议</text>
      <text x="250" y="88" fill="#91a4bd" font-size="8.5" text-anchor="middle">判断依据 + 预期方向</text>
      <text x="250" y="104" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">decision_log.py --add 观望 创新药 ...</text>

      <!-- Step 2: 观察 (top-right) -->
      <rect x="630" y="40" width="200" height="92" rx="5" fill="rgba(250,178,25,0.08)" stroke="#fab219" stroke-width="1.1"/>
      <circle cx="656" cy="64" r="11" fill="#fab219" opacity="0.25"/>
      <text x="656" y="68" fill="#fab219" font-size="11" font-weight="700" font-family="'Cascadia Mono', monospace" text-anchor="middle">2</text>
      <text x="678" y="68" fill="#e8f1ff" font-size="12" font-weight="600">等待 T+3 验证</text>
      <text x="730" y="88" fill="#91a4bd" font-size="8.5" text-anchor="middle">行情演化 / 用户执行结果</text>
      <text x="730" y="104" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">3 个交易日观察窗</text>

      <!-- Step 3: 复盘 (bottom-right) -->
      <rect x="630" y="330" width="200" height="92" rx="5" fill="rgba(54,211,156,0.08)" stroke="#36d39c" stroke-width="1.1"/>
      <circle cx="656" cy="354" r="11" fill="#36d39c" opacity="0.25"/>
      <text x="656" y="358" fill="#36d39c" font-size="11" font-weight="700" font-family="'Cascadia Mono', monospace" text-anchor="middle">3</text>
      <text x="678" y="358" fill="#e8f1ff" font-size="12" font-weight="600">T+3 回填复盘</text>
      <text x="730" y="378" fill="#91a4bd" font-size="8.5" text-anchor="middle">correct / wrong / neutral</text>
      <text x="730" y="394" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">decision_log.py --review 1 correct +3.2</text>

      <!-- Step 4: 校准 (bottom-left) -->
      <rect x="150" y="330" width="200" height="92" rx="5" fill="rgba(144,133,233,0.08)" stroke="#9085e9" stroke-width="1.1"/>
      <circle cx="176" cy="354" r="11" fill="#9085e9" opacity="0.25"/>
      <text x="176" y="358" fill="#9085e9" font-size="11" font-weight="700" font-family="'Cascadia Mono', monospace" text-anchor="middle">4</text>
      <text x="198" y="358" fill="#e8f1ff" font-size="12" font-weight="600">校准体系</text>
      <text x="250" y="378" fill="#91a4bd" font-size="8.5" text-anchor="middle">滚动胜率 + 准确率统计</text>
      <text x="250" y="394" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle">decision_log.py --report</text>

      <!-- Circular arrows -->
      <path d="M 352 92 Q 420 60 460 60 L 470 60 Q 520 60 560 80 Q 596 96 628 100" fill="none" stroke="rgba(232,241,255,0.4)" stroke-width="1.3" marker-end="url(#dl-arrow)"/>
      <path d="M 730 138 Q 730 210 730 255 Q 730 300 730 328" fill="none" stroke="rgba(232,241,255,0.4)" stroke-width="1.3" marker-end="url(#dl-arrow)"/>
      <path d="M 628 380 Q 596 390 560 400 Q 520 412 470 412 L 460 412 Q 420 412 352 390" fill="none" stroke="rgba(232,241,255,0.4)" stroke-width="1.3" marker-end="url(#dl-arrow)"/>
      <path d="M 250 322 Q 250 290 250 255 Q 250 220 250 190 Q 250 168 250 146" fill="none" stroke="rgba(232,241,255,0.4)" stroke-width="1.3" marker-end="url(#dl-arrow)"/>

      <!-- Win rate gauge -->
      <text x="490" y="250" fill="#536a85" font-size="8" font-family="'Cascadia Mono', monospace" text-anchor="middle" letter-spacing="0.2em">当前胜率追踪</text>
      <rect x="410" y="262" width="160" height="20" rx="10" fill="rgba(232,241,255,0.05)" stroke="rgba(232,241,255,0.12)" stroke-width="0.8"/>
      <rect x="412" y="264" width="60" height="16" rx="8" fill="rgba(54,211,156,0.5)"/>
      <text x="490" y="276" fill="#e8f1ff" font-size="9" font-family="'Cascadia Mono', monospace" text-anchor="middle">首轮 8/23 回填</text>
      <text x="490" y="308" fill="#536a85" font-size="7.5" font-family="'Cascadia Mono', monospace" text-anchor="middle" font-style="italic">胜率不达标 → 收紧建议纪律</text>

      <!-- Legend -->
      <line x1="40" y1="445" x2="940" y2="445" stroke="rgba(232,241,255,0.12)" stroke-width="0.8"/>
      <circle cx="48" cy="462" r="5" fill="#3987e5" opacity="0.6"/>
      <text x="60" y="466" fill="#91a4bd" font-size="8.5">记录（建仓/观望/止损）</text>
      <circle cx="248" cy="462" r="5" fill="#fab219" opacity="0.6"/>
      <text x="260" y="466" fill="#91a4bd" font-size="8.5">观察（3 日窗口）</text>
      <circle cx="448" cy="462" r="5" fill="#36d39c" opacity="0.6"/>
      <text x="460" y="466" fill="#91a4bd" font-size="8.5">复盘（回填 verdict）</text>
      <circle cx="648" cy="462" r="5" fill="#9085e9" opacity="0.6"/>
      <text x="660" y="466" fill="#91a4bd" font-size="8.5">校准（胜率 → 纪律）</text>
    </svg>
    <p class="foot-note">决策闭环 v1.0 · 8/20 确立 · 首批决策 8/23 T+3 复盘 · decision_log.py</p>
  </div>
</body>
</html>
